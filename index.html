<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>인바디 기록</h1>
      <p class="subhead" id="subtitle">불러오는 중</p>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="syncBtn">새로고침</button>
      <span class="sync" id="syncStatus" aria-live="polite"></span>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="사람" hidden></nav>
  <main class="panel" id="panel"><div class="empty">불러오는 중</div></main>
  <footer class="foot" id="footer">
    <div><b>다음 측정 입력 방법</b></div>
    <ol>
      <li>구글 시트 <b>인바디 기록</b>의 <b>측정</b> 탭을 엽니다<span id="sheetLink"></span>.</li>
      <li>맨 아래 빈 줄에 <b>한 사람의 한 번 측정 = 한 줄</b>로 적습니다. 이름은 같은 글자, 측정일은 연-월-일, 범위는 최소~최대입니다.</li>
      <li>이 화면을 다시 열거나 새로고침을 누르면 반영됩니다. 같은 사람이 2회 이상이면 변화 그래프가 그려집니다.</li>
    </ol>
    <div id="modeNote">이 화면은 인바디 용지에 적힌 값과 판정만 옮겨 보여 줍니다. 목표는 시트 ‘목표’ 탭 값입니다.</div>
  </footer>
</div>
